name: Documentation
description: Something in the documentation is wrong, missing or unclear
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: docs/INSTALLATION.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong, missing or unclear
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text (optional)
